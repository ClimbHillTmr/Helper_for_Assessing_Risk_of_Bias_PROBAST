name: Validate skill

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Document evidence checks
        run: python skills/medical-research-harness/scripts/test_check_bundle.py
      - name: Portable operational checks
        run: python skills/medical-research-harness/scripts/test_study.py
      - name: Independent-origin regression probes
        run: python tests/review_probes.py --out "${{ runner.temp }}/medical-harness-probes"
